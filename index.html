<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4922910975228675"
     crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fight for DSE</title>
<style>
:root{--navy:#0A2947;--cream:#F3E4C9;--sage:#D3D4C0;--brown:#8B5E3C}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--navy);font-family:"Times New Roman",Times,serif;font-size:18px;line-height:1.6}
button,input{font:inherit;color:inherit}
header.top{background:var(--navy);color:var(--cream);border-bottom:4px solid var(--brown)}
.in{max-width:820px;margin:0 auto;padding:0 20px}
header.top .in{padding-top:26px;padding-bottom:24px}
h1{margin:0;font-size:34px;cursor:pointer}
.sub{margin:4px 0 0;color:var(--sage);font-style:italic}
main{padding:26px 20px 70px}
.btn{background:transparent;color:var(--navy);border:2px solid var(--navy);border-radius:6px;padding:8px 18px;cursor:pointer;font-weight:700;margin-bottom:18px}
.btn:hover{background:var(--navy);color:var(--cream)}
.tools input{width:100%;padding:10px 14px;border-radius:6px;border:2px solid var(--navy);background:var(--cream);margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:2px solid var(--brown);background:transparent;color:var(--brown);border-radius:999px;padding:3px 16px;cursor:pointer;font-weight:700}
.chip.on{background:var(--brown);color:var(--cream)}
.card{display:block;width:100%;text-align:left;background:var(--sage);border:0;border-left:6px solid var(--brown);border-radius:6px;padding:16px 20px;margin-bottom:14px;cursor:pointer}
.card:hover{box-shadow:0 3px 0 var(--brown)}
.card h3{margin:0;font-size:22px}
.meta{color:var(--brown);font-size:15px;font-weight:700;margin-top:2px}
.card p{margin:8px 0 0}
.empty{text-align:center;padding:50px 0;font-style:italic;color:var(--brown)}
.reader{background:var(--sage);border-radius:6px;border-top:6px solid var(--brown);padding:30px clamp(18px,5vw,48px);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.reader .ttl{margin:0;font-size:36px;line-height:1.2}
.reader .meta{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--brown)}
.md h1,.md h2,.md h3,.md h4{line-height:1.25;margin:1.4em 0 .5em}
.md h1{font-size:30px}.md h2{font-size:25px;border-bottom:1px solid var(--brown);padding-bottom:4px}.md h3{font-size:21px;color:var(--brown)}
.md p{margin:.7em 0}
.md a{color:var(--brown);font-weight:700}
.md blockquote{margin:1em 0;padding:6px 18px;border-left:5px solid var(--brown);background:var(--cream);font-style:italic}
.md code{background:var(--cream);padding:1px 6px;border-radius:3px}
.md pre{background:var(--navy);color:var(--cream);padding:14px 18px;border-radius:6px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:1em 0}
.md th,.md td{border:1px solid var(--navy);padding:6px 12px}
.md th{background:var(--navy);color:var(--cream)}
.md hr{border:0;border-top:2px solid var(--brown);margin:1.6em 0}
.md img{max-width:100%}
.md math{font-family:"Times New Roman",Times,serif;font-size:1.12em}
.katex-display{display:block;text-align:center;margin:1em 0;overflow-x:auto;overflow-y:hidden}
@media print{.reader{display:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in"><h1 id="home">Fight for DSE</h1><p class="sub">Study notes, organised by subject.</p></div></header>
<main class="in" id="root"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script>
const root = document.getElementById('root');
let notes = [], filter = 'All', query = '';

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === 'class') n.className = props[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), props[k]);
    else n.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c => { if (c != null) n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
}

function mdHtml(src) {
  const maths = [];
  const stash = (t, d) => { maths.push([t, d]); return 'MATHTOKEN' + (maths.length - 1) + 'X'; };
  const s = src
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => stash(t, true))
    .replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => stash(t, true))
    .replace(/\\\(([\s\S]+?)\\\)/g, (m, t) => stash(t, false))
    .replace(/(^|[^\\$])\$(?!\s)([^\n$]+?)(?<!\s)\$/g, (m, p, t) => p + stash(t, false));
  const html = DOMPurify.sanitize(marked.parse(s, { gfm: true, breaks: true })).replace(/MATHTOKEN(\d+)X/g, (m, i) => {
    const [t, d] = maths[+i];
    try { return katex.renderToString(t, { displayMode: d, output: 'mathml', throwOnError: false }); } catch (e) { return ''; }
  });
  const box = el('div', { class: 'md' });
  box.innerHTML = html;
  box.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  return box;
}

function list() {
  const subjects = ['All', ...new Set(notes.map(n => n.subject))];
  const q = query.toLowerCase();
  const shown = notes.filter(n => (filter === 'All' || n.subject === filter) && (!q || (n.title + ' ' + (n.desc || '') + ' ' + n.subject).toLowerCase().includes(q)));
  const s = el('input', { type: 'search', placeholder: 'Search notes…', value: query });
  s.addEventListener('input', e => { query = e.target.value; list(); const x = root.querySelector('input'); x.focus(); x.setSelectionRange(query.length, query.length); });
  root.replaceChildren(
    notes.length ? el('div', { class: 'tools' }, s) : '',
    subjects.length > 1 ? el('div', { class: 'chips' }, subjects.map(x => el('button', { class: 'chip' + (x === filter ? ' on' : ''), onclick: () => { filter = x; list(); } }, x))) : '',
    shown.length ? el('div', null, shown.map(n => el('button', { class: 'card', onclick: () => { location.hash = '#/' + n.slug; } },
      el('h3', null, n.title), el('div', { class: 'meta' }, n.subject + ' · ' + n.date), n.desc ? el('p', null, n.desc) : ''))) : el('div', { class: 'empty' }, 'No notes found.'));
}

async function read(slug) {
  const n = notes.find(x => x.slug === slug);
  if (!n) { location.hash = ''; return; }
  root.replaceChildren(el('div', { class: 'empty' }, 'Loading…'));
  let text = '';
  try { const r = await fetch('notes/' + encodeURIComponent(slug) + '.md'); if (!r.ok) throw 0; text = await r.text(); }
  catch (e) { root.replaceChildren(el('div', { class: 'empty' }, 'Could not load this note.')); return; }
  const art = el('article', { class: 'reader' }, el('h2', { class: 'ttl' }, n.title), el('div', { class: 'meta' }, n.subject + ' · ' + n.date), mdHtml(text));
  ['contextmenu', 'copy', 'dragstart'].forEach(ev => art.addEventListener(ev, e => e.preventDefault()));
  root.replaceChildren(el('button', { class: 'btn', onclick: () => { location.hash = ''; } }, '← All notes'), art);
  window.scrollTo(0, 0);
}

function route() { const h = location.hash; h.startsWith('#/') ? read(decodeURIComponent(h.slice(2))) : list(); }
document.getElementById('home').addEventListener('click', () => { location.hash = ''; });
window.addEventListener('hashchange', route);
fetch('notes.json').then(r => r.json()).then(d => { notes = d.sort((a, b) => b.date.localeCompare(a.date)); route(); })
  .catch(() => root.replaceChildren(el('div', { class: 'empty' }, 'Could not load notes.')));
</script>
</body>
</html>
